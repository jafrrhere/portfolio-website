    <link rel="stylesheet" href="styles.css">
    <style>
        @font-face {
            font-family: 'Akatab Bold';
            src: url('fonts/Akatab-Bold.ttf') format('truetype');
            font-weight: bold;
            font-style: normal;
        }

        /* Navigation Menu */
        .navbar {
            position: fixed;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: auto;
            padding: 1rem;
            display: flex;
            justify-content: center;
            gap: 7rem;
            z-index: 1000;
        }

        .navbar a {
            color: #fff;
            text-decoration: none;
            font-family: 'Akatab Bold', sans-serif;
            font-weight: 200;
            transition: color 0.2s ease;
            position: relative;
            background: transparent;
        }

        .navbar a::after {
            content: '';
            position: absolute;
            width: 0;
            height: 2px;
            bottom: -4px;
            left: 0;
            background-color: #666666;
            transition: width 0.3s ease;
        }

        .navbar a:hover::after {
            width: 100%;
        }

        .navbar a:hover {
            color: #666666;
            background: transparent;
        }

        /* Hamburger Menu */
        .hamburger {
            display: none;
            cursor: pointer;
            padding: 10px;
            position: fixed;
            top: 20px;
            right: 30px;
            z-index: 1001;
            pointer-events: auto;
            -webkit-tap-highlight-color: #666666;
        }

        .hamburger-line {
            width: 25px;
            height: 3px;
            background-color: #fff;
            margin: 5px 0;
            transition: all 0.3s ease;
        }

        @media (max-width: 768px) {
            .hamburger {
                display: block;
                pointer-events: auto;
            }

            .navbar {
                display: none;
                position: fixed;
                top: 0 !important;
                right: 30px !important;
                left: auto;
                transform: none;
                width: auto;
                background: rgba(0, 0, 0, 0.95);
                padding: 60px 20px 20px 20px;
                border-radius: 0 0 10px 10px;
                pointer-events: auto;
                gap: 15px;
            }

            .navbar.active {
                display: flex;
                flex-direction: column;
                align-items: flex-end;
                gap: 40px;
                margin-top: 20px;
            }

            .navbar a {
                font-size: 14px;
            }

            /* Hamburger Animation */
            .hamburger.active .hamburger-line:nth-child(1) {
                transform: rotate(45deg) translate(5px, 5px);
            }

            .hamburger.active .hamburger-line:nth-child(2) {
                opacity: 0;
            }

            .hamburger.active .hamburger-line:nth-child(3) {
                transform: rotate(-45deg) translate(7px, -6px);
            }
        }

        /* Animated Horizontal Line */
        .animated-hr {
            width: 0;
            height: 2.1px;
            border: none;
            background-color: #D9D9D9;
            margin-top: 40px;
            margin-bottom: 40px;
        }

        .animated-hr.animate {
            animation: growLine 0.3s ease-out forwards;
        }

        @keyframes growLine {
            from {
                width: 0;
            }
            to {
                width: 12%;
            }
        }

        /* Bottom line animation */
        .bottom-hr {
            width: 97%;
            height: 1px;
            border: none;
            background-color: #666666;
            margin-top: 100px;
            transform-origin: left;
            transform: scaleX(0);
        }

        .bottom-hr.animate {
            animation: growBottomLine 0.9s ease-out forwards;
        }

        @keyframes growBottomLine {
            from {
                transform: scaleX(0);
            }
            to {
                transform: scaleX(1);
            }
        }

        @media (max-width: 768px) {
            /* (All card-related CSS removed) */
        }

        /* Card Grid and Card Styles */
        .card-grid {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2.5rem;
            margin-top: 4rem;
        }
        .card-row {
            display: flex;
            flex-direction: row;
            gap: 2.5rem;
        }
        .card {
          --pink-500: #fda8ff;
          --red-400: #f56767;
          --sky-300: #bbefff;
          --blue-500: #00a3fe;

          cursor: pointer;
          position: relative;
          display: flex;
          flex-direction: column;
          justify-content: center;
          gap: 0.75rem;

          padding: 1rem;
          width: 14rem;
          height: auto;
          background-color: rgba(0, 0, 0, 0);
          border: 2px solid #ffffff;

          border-radius: 0.5rem;
        }
        .card .rectangle {
          position: absolute;

          width: 0.925rem;
          aspect-ratio: 1 / 1;
          background-color: rgb(0, 0, 0);

          opacity: 0;
          box-shadow: 0rem 0rem 0rem 0.175rem rgb(255, 255, 255);
        }
        .card:hover .rectangle {
          opacity: 1;
        }
        .card .rectangle.left-top {
          top: -0.25rem;
          left: -0.25rem;
        }
        .card .rectangle.right-top {
          top: -0.25rem;
          right: -0.25rem;
        }
        .card .rectangle.left-bottom {
          bottom: -0.25rem;
          left: -0.25rem;
        }
        .card .rectangle.right-bottom {
          bottom: -0.25rem;
          right: -0.25rem;
        }
        .card .image {
          position: relative;
          z-index: 10;
          display: flex;
          justify-content: center;
          align-items: center;

          padding: 0.25rem;
          width: 100%;
          height: 7.25rem;
          background-color: var(--pink-500);

          border-radius: 0.25rem;
        }
        .card .image .svg {
          width: 2.5rem;
          fill: black;
        }
        .card .title {
          position: relative;
          z-index: 10;

          font-size: 1.25rem;
          color: white;
          font-weight: bold;
        }
        .card .love {
          display: flex;
          align-items: center;
          gap: 0.375rem;

          font-size: 1rem;
          font-weight: bold;
          color: white;
        }
        .card .love .svg {
          width: 1.25rem;
          fill: var(--red-400);
        }
        .card .category {
          display: flex;
          align-items: center;
          gap: 0.375rem;
        }
        .card .category .button {
          cursor: pointer;

          padding: 0.25rem 0.5rem;
          background-color: #d9d9d9;

          font-size: 0.5rem;
          color: black;

          border: 2px solid transparent;
          border-radius: 9999px;
          transition: all 0.3s ease-in-out;
        }
        .card .category .button:hover {
          border: 2px solid var(--blue-500);
        }
        .card .action {
          padding-block: 0.375rem;
          margin-top: 0.75rem;
          background-color: var(--sky-300);

          font-size: 0.75rem;
          font-weight: 700;
          color: black;

          border: 2px solid transparent;
          border-radius: 0.5rem;
          transition: all 0.3s ease-in-out;
        }
        .card .action:hover {
          border: 2px solid var(--blue-500);
        }
        @media (max-width: 900px) {
          .card-row {
            flex-direction: column;
            gap: 2rem;
            align-items: center;
          }
        }
    </style>

    <script>
        // Hamburger Menu Functionality
        const hamburger = document.querySelector('.hamburger');
        const navbar = document.querySelector('.navbar');
        
        if (hamburger && navbar) {
            hamburger.addEventListener('click', function(e) {
                e.stopPropagation();
                this.classList.toggle('active');
                navbar.classList.toggle('active');
            });

            // Close menu when clicking a link
            const navLinks = document.querySelectorAll('.navbar a');
            navLinks.forEach(link => {
                link.addEventListener('click', () => {
                    hamburger.classList.remove('active');
                    navbar.classList.remove('active');
                });
            });

            // Close menu when clicking outside
            document.addEventListener('click', function(event) {
                if (!hamburger.contains(event.target) && !navbar.contains(event.target)) {
                    hamburger.classList.remove('active');
                    navbar.classList.remove('active');
                }
            });
        }

        // Animated HR Intersection Observer
        const hr = document.querySelector('.animated-hr');
        if (hr) {
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        hr.classList.add('animate');
                    }
                });
            }, { threshold: 0.1 });

            observer.observe(hr);
        }

        // Bottom HR Animation
        const bottomHr = document.querySelector('.bottom-hr');
        if (bottomHr) {
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        bottomHr.classList.add('animate');
                    }
                });
            }, { threshold: 0.1 });

            observer.observe(bottomHr);
        }
    </script>
