<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jafar Tamboli - Design Projects</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@900;400&family=Roboto:wght@300;400;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <style>
        @font-face {
            font-family: 'Akatab Bold';
            src: url('fonts/Akatab-Bold.ttf') format('truetype');
            font-weight: bold;
            font-style: normal;
        }

        /* Navigation Menu */
        .navbar {
            position: fixed;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: auto;
            padding: 1rem;
            display: flex;
            justify-content: center;
            gap: 7rem;
            z-index: 1000;
        }

        .navbar a {
            color: #fff;
            text-decoration: none;
            font-family: 'Akatab Bold', sans-serif;
            font-weight: 200;
            transition: color 0.2s ease;
            position: relative;
            background: transparent;
        }

        .navbar a::after {
            content: '';
            position: absolute;
            width: 0;
            height: 2px;
            bottom: -4px;
            left: 0;
            background-color: #666666;
            transition: width 0.3s ease;
        }

        .navbar a:hover::after {
            width: 100%;
        }

        .navbar a:hover {
            color: #666666;
            background: transparent;
        }

        /* Hamburger Menu */
        .hamburger {
            display: none;
            cursor: pointer;
            padding: 10px;
            position: fixed;
            top: 20px;
            right: 30px;
            z-index: 1001;
            pointer-events: auto;
            -webkit-tap-highlight-color: #666666;
        }

        .hamburger-line {
            width: 25px;
            height: 3px;
            background-color: #fff;
            margin: 5px 0;
            transition: all 0.3s ease;
        }

        @media (max-width: 768px) {
            .hamburger {
                display: block;
                pointer-events: auto;
            }

            .navbar {
                display: none;
                position: fixed;
                top: 0;
                right: 30px;
                left: auto;
                transform: none;
                width: auto;
                background: rgba(0, 0, 0, 0.95);
                padding: 60px 20px 20px 20px;
                border-radius: 0 0 10px 10px;
                pointer-events: auto;
            }

            .navbar.active {
                display: flex;
                flex-direction: column;
                align-items: flex-end;
                gap: 15px;
            }

            /* Hamburger Animation */
            .hamburger.active .hamburger-line:nth-child(1) {
                transform: rotate(45deg) translate(5px, 5px);
            }

            .hamburger.active .hamburger-line:nth-child(2) {
                opacity: 0;
            }

            .hamburger.active .hamburger-line:nth-child(3) {
                transform: rotate(-45deg) translate(7px, -6px);
            }
        }

        /* Animated Horizontal Line */
        .animated-hr {
            width: 0;
            height: 2.1px;
            border: none;
            background-color: #D9D9D9;
            margin-top: 40px;
            margin-bottom: 40px;
        }

        .animated-hr.animate {
            animation: growLine 0.3s ease-out forwards;
        }

        @keyframes growLine {
            from {
                width: 0;
            }
            to {
                width: 12%;
            }
        }

        /* Bottom line animation */
        .bottom-hr {
            width: 97%;
            height: 1px;
            border: none;
            background-color: #666666;
            margin-top: 100px;
            transform-origin: left;
            transform: scaleX(0);
        }

        .bottom-hr.animate {
            animation: growBottomLine 0.9s ease-out forwards;
        }

        @keyframes growBottomLine {
            from {
                transform: scaleX(0);
            }
            to {
                transform: scaleX(1);
            }
        }

        .coding-cards-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5rem;
            margin: 8rem auto;
            max-width: 1000px;
            padding: 0 1rem;
        }
        .coding-cards-row {
            display: flex;
            justify-content: center;
            gap: 9rem;
        }
        .coding-card {
            --font-color: #ffffff;
            --font-color-sub: #ffffff;
            --bg-color: transparent;
            --main-color: #ffffff;
            --border-color: #ffffff;
            --shadow-color: #FF4655;
            width: 200px;
            height: 254px;
            background: var(--bg-color);
            border: 2px solid var(--border-color);
            box-shadow: 6px 6px var(--shadow-color);
            border-radius: 5px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 1rem;
            position: relative;
            z-index: 1;
        }
        .coding-card-photo {
            width: 201.6px;
            height: 113.4px;
            border-radius: 4px;
            background-image: url('https://hdyloqcphgwfyuyvchvi.supabase.co/storage/v1/object/public/project-images//1711.png');
            background-size: cover;
            background-position: center;
            margin-bottom: 1rem;
            border: 2px solid var(--border-color);
        }
        .coding-card-title {
            text-align: center;
            color: var(--font-color);
            font-size: 20px;
            font-weight: 400;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            margin: 0.5rem 0;
        }
        .coding-card-title span {
            font-size: 15px;
            color: var(--font-color-sub);
            display: block;
            margin-top: 0.5rem;
        }
        .button-borders {
            position: relative;
            width: fit-content;
            height: fit-content;
            margin-top: auto;
            z-index: 2;
            pointer-events: auto;
        }
        .primary-button {
            font-family: 'Ropa Sans', sans-serif;
            color: white;
            cursor: pointer;
            font-size: 13px;
            font-weight: bold;
            letter-spacing: 0.05rem;
            border: 1px solid #0E1822;
            padding: 0.8rem 2.1rem;
            background-color: #0E1822;
            background-size: 200%;
            background-position: 200%;
            background-repeat: no-repeat;
            transition: 0.3s ease-in-out;
            transition-property: background-position, border, color;
            position: relative;
            z-index: 2;
            pointer-events: auto;
        }
        .primary-button:hover {
            border: 1px solid #FF4655;
            color: white;
            background-position: 40%;
        }
        .primary-button:before {
            content: "";
            position: absolute;
            background-color: #0E1822;
            width: 0.2rem;
            height: 0.2rem;
            top: -1px;
            left: -1px;
            transition: background-color 0.15s ease-in-out;
        }
        .primary-button:hover:before {
            background-color: white;
        }
        .primary-button:hover:after {
            background-color: white;
        }
        .primary-button:after {
            content: "";
            position: absolute;
            background-color: #FF4655;
            width: 0.3rem;
            height: 0.3rem;
            bottom: -1px;
            right: -1px;
            transition: background-color 0.15s ease-in-out;
        }
        .button-borders:before {
            content: "";
            position: absolute;
            width: calc(100% + 0.5em);
            height: 50%;
            left: -0.3em;
            top: -0.3em;
            border: 1px solid #0E1822;
            border-bottom: 0px;
        }
        .button-borders:after {
            content: "";
            position: absolute;
            width: calc(100% + 0.5em);
            height: 50%;
            left: -0.3em;
            bottom: -0.3em;
            border: 1px solid #0E1822;
            border-top: 0px;
            z-index: 0;
        }
        @media (max-width: 768px) {
            .coding-cards-container {
                margin: 4rem auto;
                padding: 0;
                width: 100%;
            }
            .coding-cards-row {
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 2rem;
                width: 100%;
            }
            .coding-card {
                width: 280px;
                height: 254px;
                margin: 0;
            }
            .coding-card-photo {
                width: 201.6px;
                height: 113.4px;
            }
            .coding-cards-container > .coding-cards-row:last-child {
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 2rem;
            }
        }
    </style>
</head>
<body>
    <div class="red-circle"></div>
    <div class="content-wrapper">
        <!-- Hamburger Menu -->
        <div class="hamburger">
            <div class="hamburger-line"></div>
            <div class="hamburger-line"></div>
            <div class="hamburger-line"></div>
        </div>

        <!-- Navigation Menu -->
        <nav class="navbar">
            <a href="index.html">Index</a>
            <a href="coding.html">Coding</a>
            <a href="design.html">Design</a>
            <a href="about.html">About</a>
        </nav>

       

        <!-- Cards Container -->
        <div class="coding-cards-container">
            <!-- First Row -->
            <div class="coding-cards-row">
                <div class="coding-card">
                    <div class="coding-card-photo"></div>
                    <div class="coding-card-title">UI/UX Design <br><span>Web & Mobile Interfaces</span></div>
                    <div class="button-borders">
                        <button class="primary-button">BUTTON</button>
                    </div>
                </div>
                <div class="coding-card">
                    <div class="coding-card-photo"></div>
                    <div class="coding-card-title">Branding Identity <br><span>Logo & Visual Design</span></div>
                    <div class="button-borders">
                        <button class="primary-button">BUTTON</button>
                    </div>
                </div>
                <div class="coding-card">
                    <div class="coding-card-photo"></div>
                    <div class="coding-card-title">Digital Artwork <br><span>Creative Illustrations</span></div>
                    <div class="button-borders">
                        <button class="primary-button">BUTTON</button>
                    </div>
                </div>
            </div>
            
            <!-- Second Row -->
            <div class="coding-cards-row">
                <div class="coding-card">
                    <div class="coding-card-photo"></div>
                    <div class="coding-card-title">Graphic Design <br><span>Print & Digital Media</span></div>
                    <div class="button-borders">
                        <button class="primary-button">BUTTON</button>
                    </div>
                </div>
                <div class="coding-card">
                    <div class="coding-card-photo"></div>
                    <div class="coding-card-title">Motion Graphics <br><span>Animated Designs</span></div>
                    <div class="button-borders">
                        <button class="primary-button">BUTTON</button>
                    </div>
                </div>
                <div class="coding-card">
                    <div class="coding-card-photo"></div>
                    <div class="coding-card-title">Packaging Design <br><span>Product Branding</span></div>
                    <div class="button-borders">
                        <button class="primary-button">BUTTON</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        // Hamburger Menu Functionality
        const hamburger = document.querySelector('.hamburger');
        const navbar = document.querySelector('.navbar');
        
        if (hamburger && navbar) {
            hamburger.addEventListener('click', function(e) {
                e.stopPropagation();
                this.classList.toggle('active');
                navbar.classList.toggle('active');
            });

            // Close menu when clicking a link
            const navLinks = document.querySelectorAll('.navbar a');
            navLinks.forEach(link => {
                link.addEventListener('click', () => {
                    hamburger.classList.remove('active');
                    navbar.classList.remove('active');
                });
            });

            // Close menu when clicking outside
            document.addEventListener('click', function(event) {
                if (!hamburger.contains(event.target) && !navbar.contains(event.target)) {
                    hamburger.classList.remove('active');
                    navbar.classList.remove('active');
                }
            });
        }

        // Animated HR Intersection Observer
        const hr = document.querySelector('.animated-hr');
        if (hr) {
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        hr.classList.add('animate');
                    }
                });
            }, { threshold: 0.1 });

            observer.observe(hr);
        }

        // Bottom HR Animation
        const bottomHr = document.querySelector('.bottom-hr');
        if (bottomHr) {
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        bottomHr.classList.add('animate');
                    }
                });
            }, { threshold: 0.1 });

            observer.observe(bottomHr);
        }
    </script>
</body>
</html>
