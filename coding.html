    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@900;400&family=Roboto:wght@300;400;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">

    <style>
        @font-face {
            font-family: 'Akatab Bold';
            src: url('fonts/Akatab-Bold.ttf') format('truetype');
            font-weight: bold;
            font-style: normal;
        }

        /* Navigation Menu */
        .navbar {
            position: fixed;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: auto;
            padding: 1rem;
            display: flex;
            justify-content: center;
            gap: 7rem;
            z-index: 1000;
        }

        .navbar a {
            color: #fff;
            text-decoration: none;
            font-family: 'Akatab Bold', sans-serif;
            font-weight: 200;
            transition: color 0.2s ease;
            position: relative;
            background: transparent;
        }

        .navbar a::after {
            content: '';
            position: absolute;
            width: 0;
            height: 2px;
            bottom: -4px;
            left: 0;
            background-color: #666666;
            transition: width 0.3s ease;
        }

        .navbar a:hover::after {
            width: 100%;
        }

        .navbar a:hover {
            color: #666666;
            background: transparent;
        }

        /* Hamburger Menu */
        .hamburger {
            display: none;
            cursor: pointer;
            padding: 10px;
            position: fixed;
            top: 20px;
            right: 30px;
            z-index: 1001;
            pointer-events: auto;
            -webkit-tap-highlight-color: #666666;
        }

        .hamburger-line {
            width: 25px;
            height: 3px;
            background-color: #fff;
            margin: 5px 0;
            transition: all 0.3s ease;
        }

        @media (max-width: 768px) {
            .hamburger {
                display: block;
                pointer-events: auto;
            }

            .navbar {
                display: none;
                position: fixed;
                top: 0;
                right: 30px;
                left: auto;
                transform: none;
                width: auto;
                background: rgba(0, 0, 0, 0.95);
                padding: 60px 20px 20px 20px;
                border-radius: 0 0 10px 10px;
                pointer-events: auto;
            }

            .navbar.active {
                display: flex;
                flex-direction: column;
                align-items: flex-end;
                gap: 15px;
            }

            /* Hamburger Animation */
            .hamburger.active .hamburger-line:nth-child(1) {
                transform: rotate(45deg) translate(5px, 5px);
            }

            .hamburger.active .hamburger-line:nth-child(2) {
                opacity: 0;
            }

            .hamburger.active .hamburger-line:nth-child(3) {
                transform: rotate(-45deg) translate(7px, -6px);
            }
        }

        /* Animated Horizontal Line */
        .animated-hr {
            width: 0;
            height: 2.1px;
            border: none;
            background-color: #D9D9D9;
            margin-top: 40px;
            margin-bottom: 40px;
        }

        .animated-hr.animate {
            animation: growLine 0.3s ease-out forwards;
        }

        @keyframes growLine {
            from {
                width: 0;
            }
            to {
                width: 12%;
            }
        }

        /* Bottom line animation */
        .bottom-hr {
            width: 97%;
            height: 1px;
            border: none;
            background-color: #666666;
            margin-top: 100px;
            transform-origin: left;
            transform: scaleX(0);
        }

        .bottom-hr.animate {
            animation: growBottomLine 0.9s ease-out forwards;
        }

        @keyframes growBottomLine {
            from {
                transform: scaleX(0);
            }
            to {
                transform: scaleX(1);
            }
        }
    </style>
</head>

    <script>
        // Hamburger Menu Functionality
        const hamburger = document.querySelector('.hamburger');
        const navbar = document.querySelector('.navbar');
        
        if (hamburger && navbar) {
            hamburger.addEventListener('click', function(e) {
                e.stopPropagation();
                this.classList.toggle('active');
                navbar.classList.toggle('active');
            });

            // Close menu when clicking a link
            const navLinks = document.querySelectorAll('.navbar a');
            navLinks.forEach(link => {
                link.addEventListener('click', () => {
                    hamburger.classList.remove('active');
                    navbar.classList.remove('active');
                });
            });

            // Close menu when clicking outside
            document.addEventListener('click', function(event) {
                if (!hamburger.contains(event.target) && !navbar.contains(event.target)) {
                    hamburger.classList.remove('active');
                    navbar.classList.remove('active');
                }
            });
        }

        // Animated HR Intersection Observer
        const hr = document.querySelector('.animated-hr');
        if (hr) {
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        hr.classList.add('animate');
                    }
                });
            }, { threshold: 0.1 });

            observer.observe(hr);
        }

        // Bottom HR Animation
        const bottomHr = document.querySelector('.bottom-hr');
        if (bottomHr) {
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        bottomHr.classList.add('animate');
                    }
                });
            }, { threshold: 0.1 });

            observer.observe(bottomHr);
        }
    </script>
