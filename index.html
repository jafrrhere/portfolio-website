<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jafar Tamboli - Professional Excuse-Maker</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@900;400&family=Roboto:wght@300;400;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <style>
        /* Base styles */
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }
        
        body {
            background-color: #000000;
            font-size: 16px;
        }

        /* Responsive typography */
        @media (max-width: 768px) {
            body {
                font-size: 14px;
            }
        }
        
        /* Custom text selection color */
        ::selection {
            background: #e0e0e0;
            color: #000;
        }
        
        ::-moz-selection {
            background: #e0e0e0;
            color: #000;
        }
        
        .content-wrapper {
            position: relative;
            z-index: 1;
            min-height: 100vh;
        }

        /* Image Card Section Styles */
        .image-card-section {
            display: flex;
            align-items: center;
            gap: 2rem;
            padding: 1rem;
            margin: 0.5rem auto;
            max-width: 1200px;
            width: 90%;
            background: rgba(0, 0, 0, 0.7);
            border-radius: 15px;
        }

        .image-card-section.reversed {
            flex-direction: row-reverse;
        }

        .image-container {
            flex: 1;
            position: relative;
            overflow: hidden;
            border-radius: 10px;
            aspect-ratio: 4/5;
            max-width: 400px;
            min-width: 300px;
        }

        .image-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.3s ease;
        }

        .image-container:hover img {
            transform: scale(1.05);
        }

        .image-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .image-container:hover .image-overlay {
            opacity: 1;
        }

        .image-label {
            color: white;
            font-size: 1.2rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .image-description {
            flex: 1;
            padding: 2rem;
            max-width: 600px;
        }

        .image-description h2 {
            color: #00fff7;
            margin-bottom: 1.5rem;
            font-size: 2rem;
        }

        .description-text {
            color: #fff;
            margin-bottom: 1rem;
            line-height: 1.6;
        }

        .tech-stack {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin: 1.5rem 0;
        }

        .tech-tag {
            background: rgba(0, 255, 247, 0.1);
            color: #00fff7;
            padding: 0.5rem 1rem;
            border-radius: 20px;
            font-size: 0.9rem;
        }

        .project-actions {
            display: flex;
            gap: 1rem;
            margin-top: 2rem;
        }

        .action-btn {
            background: #00fff7;
            color: #000;
            border: none;
            padding: 0.8rem 1.5rem;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .action-btn:hover {
            background: #01e875;
            transform: translateY(-2px);
        }

        .action-btn.secondary {
            background: transparent;
            border: 2px solid #00fff7;
            color: #00fff7;
        }

        .action-btn.secondary:hover {
            background: rgba(0, 255, 247, 0.1);
        }

        @media (max-width: 768px) {
            .image-card-section {
                flex-direction: column;
                padding: 1rem;
                gap: 1rem;
            }

            .image-card-section.reversed {
                flex-direction: column;
            }

            .image-container {
                width: 100%;
                max-width: 400px;
                min-width: 300px;
                aspect-ratio: 4/5;
                margin: 0 auto;
                order: -1;
            }

            .image-description {
                padding: 1rem 0;
                order: 1;
            }

            .image-description h2 {
                font-size: 1.5rem;
            }

            .tech-stack {
                gap: 0.3rem;
            }

            .tech-tag {
                font-size: 0.8rem;
                padding: 0.3rem 0.8rem;
            }

            .project-actions {
                flex-direction: column;
                gap: 0.5rem;
            }

            .action-btn {
                width: 100%;
            }
        }

        .carousel-section {
            margin: 2rem auto 0 auto;
            max-width: 1200px;
            padding: 0 1rem;
        }
        .carousel-title {
            color: #fff;
            font-size: 1.5rem;
            margin-bottom: 1rem;
            font-family: 'Montserrat', sans-serif;
        }
        .carousel-container {
            overflow: hidden;
            width: 100%;
            position: relative;
            background: rgba(0,0,0,0.2);
            border-radius: 10px;
            padding: 1rem 0;
        }
        .carousel-track {
            display: flex;
            gap: 2rem;
            transition: transform 0.5s cubic-bezier(0.4,0,0.2,1);
            will-change: transform;
        }
        .carousel-item {
            flex: 0 0 220px;
            position: relative;
            cursor: pointer;
            transition: transform 0.3s;
            z-index: 1;
        }
        .carousel-item img {
            width: 100%;
            height: 130px;
            object-fit: cover;
            border-radius: 8px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.4);
            transition: box-shadow 0.3s, transform 0.3s;
        }
        .carousel-item:hover {
            transform: scale(1.15) translateY(-10px);
            z-index: 2;
        }
        .carousel-item:hover img {
            box-shadow: 0 8px 32px #00fff7cc;
        }
        .carousel-desc {
            display: none;
        }
        .carousel-item::after {
            content: attr(data-desc);
            display: block;
            position: absolute;
            left: 50%;
            bottom: -60px;
            transform: translateX(-50%) scale(0.95);
            background: rgba(24,25,28,0.98);
            color: #fff;
            padding: 0.7rem 1.2rem;
            border-radius: 8px;
            font-size: 1rem;
            font-family: 'Roboto', sans-serif;
            white-space: pre-line;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s, transform 0.2s;
            min-width: 180px;
            max-width: 240px;
            box-shadow: 0 4px 24px #000a;
        }
        .carousel-item:hover::after {
            opacity: 1;
            transform: translateX(-50%) scale(1.05);
        }
        @media (max-width: 700px) {
            .carousel-item { flex-basis: 140px; }
            .carousel-item img { height: 80px; }
            .carousel-section { max-width: 100vw; }
        }
        .profile-card {
            position: absolute;
            right: 25px;
            top: 60px;
            z-index: 3;
            width: 300px;
        }
        @media (max-width: 768px) {
            .profile-card {
                position: relative;
                right: auto;
                top: 20px;
                width: 90%;
                max-width: 300px;
                margin: 0 auto;
            }

            .profile-img {
                width: 120px;
                height: 120px;
            }
        }

        /* Spline container styles */
        #spline-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            z-index: 0;
        }

        .content-wrapper {
            position: relative;
            z-index: 1;
            min-height: 100vh;
            pointer-events: none;
        }

        /* Re-enable pointer events for interactive elements */
        .navbar, .image-card-section, .action-btn, .know-more, .see-more-coding, .see-more-design {
            pointer-events: auto;
        }

        /* Center Text Responsive Styles */
        .center {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* Skills Section Responsive Styles */
        .skills {
            padding: 1rem;
        }

        @media (max-width: 768px) {
            .skill-row {
                flex-direction: column;
                gap: 0.5rem;
            }

            .skill-label {
                font-size: 0.9rem;
            }

            .skill-bar {
                width: 100%;
            }
        }

        /* Add smooth scrolling for better mobile experience */
        html {
            scroll-behavior: smooth;
        }

        /* Improve touch targets for mobile */
        @media (max-width: 768px) {
            .navbar a,
            .action-btn,
            .tech-tag {
                min-height: 44px;
                min-width: 44px;
                display: flex;
                align-items: center;
                justify-content: center;
            }
        }

        /* 16:9 Image Card Styles */
        .fullwidth-image-card {
            width: calc(100% - 40px);
            margin: 0 20px;
            position: relative;
            overflow: hidden;
        }
        .fullwidth-image-card-inner {
            width: 100%;
            padding-top: 56.25%; /* 16:9 Aspect Ratio */
            position: relative;
        }
        .fullwidth-image-card img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* 4:5 Side-by-Side Image Cards */
        .sidebyside-image-cards {
            display: flex;
            width: 100%;
            margin-top: 30px;
            margin-bottom: 30px;
        }
        .sidebyside-image-card {
            position: relative;
            width: calc(50% - 2px);
            overflow: hidden;
        }
        .sidebyside-image-card-inner {
            width: 100%;
            padding-top: 125%; /* 4:5 Aspect Ratio (5/4 = 1.25) */
            position: relative;
        }
        .sidebyside-image-card img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .sidebyside-image-card.left {
            margin-left: 20px;
            margin-right: 10px;
        }
        .sidebyside-image-card.right {
            margin-left: 10px;
            margin-right: 20px;
        }
        @media (max-width: 900px) {
            .sidebyside-image-cards {
                flex-direction: column;
            }
            .sidebyside-image-card.left,
            .sidebyside-image-card.right {
                margin: 10px 20px;
                width: calc(100% - 40px);
            }
        }

        @font-face {
            font-family: 'Akatab Bold';
            src: url('fonts/Akatab-Bold.ttf') format('truetype');
            font-weight: bold;
            font-style: normal;
        }
        @font-face {
            font-family: 'AdventPro medium';
            src: url('fonts/AdventPro-Medium.ttf') format('truetype');
            font-weight: bold;
            font-style: normal;
        }
        .know-more {
            font-family: 'Akatab Bold', sans-serif;
        }
        .see-more-coding {
            display: block;
            margin-top: 18px;
            margin-left: 30%;
            padding-right: 25%;
            font-family: 'AdventPro medium', sans-serif;
            font-size: 1.1rem;
            color: #ffffff;
            text-decoration: none;
            border-radius: 5px;
            padding: 0.5em 1.2em;
            letter-spacing: 0.05em;
            background: transparent;
            transition: all 0.3s ease;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }
        .see-more-design {
            display: block;
            margin-top: 18px;
            margin-right: 30%;
            text-align: right;
            padding-right: 25%;
            font-family: 'AdventPro medium', sans-serif;
            font-size: 1.1rem;
            color: #ffffff;
            text-decoration: none;
            border-radius: 5px;
            padding: 0.5em 1.2em;
            letter-spacing: 0.05em;
            background: transparent;
            transition: all 0.3s ease;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }
        .see-more-coding::after, .see-more-design::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: fit-content;
            height: 2px;
            background-color: #666666;
            transform: scaleX(0);
            transform-origin: right;
            transition: transform 0.3s ease;
        }
        .see-more-coding::after {
            left: 30%;
        }
        .see-more-design::after {
            right: 30%;
            left: auto;
        }
        .see-more-coding:hover::after, .see-more-design:hover::after {
            transform: scaleX(1);
            transform-origin: left;
        }
        .see-more-coding:hover, .see-more-design:hover {
            color: #666;
            transform: translateY(-2px);
        }

        /* Navigation Menu */
        .navbar {
            position: fixed;
            top: 0;
            right: 30px;
            width: auto;
            padding: 1rem;
            display: flex;
            justify-content: flex-end;
            gap: 2rem;
            z-index: 1000;
        }

        .navbar a {
            color: #fff;
            text-decoration: none;
            font-family: 'Montserrat', sans-serif;
            font-weight: 400;
            transition: color 0.3s ease;
        }

        .navbar a:hover {
            color: #666666;
        }

        /* Hamburger Menu */
        .hamburger {
            display: none;
            cursor: pointer;
            padding: 10px;
            position: fixed;
            top: 20px;
            right: 30px;
            z-index: 1001;
            pointer-events: auto;
        }

        .hamburger-line {
            width: 25px;
            height: 3px;
            background-color: #fff;
            margin: 5px 0;
            transition: all 0.3s ease;
        }

        @media (max-width: 768px) {
            .hamburger {
                display: block;
                pointer-events: auto;
            }

            .navbar {
                display: none;
                position: fixed;
                top: 0;
                right: 30px;
                width: auto;
                background: rgba(0, 0, 0, 0.95);
                padding: 60px 20px 20px 20px;
                border-radius: 0 0 10px 10px;
                pointer-events: auto;
            }

            .navbar.active {
                display: flex;
                flex-direction: column;
                align-items: flex-end;
                gap: 15px;
            }

            /* Hamburger Animation */
            .hamburger.active .hamburger-line:nth-child(1) {
                transform: rotate(45deg) translate(5px, 5px);
            }

            .hamburger.active .hamburger-line:nth-child(2) {
                opacity: 0;
            }

            .hamburger.active .hamburger-line:nth-child(3) {
                transform: rotate(-45deg) translate(7px, -6px);
            }
        }

        /* Animated Horizontal Line */
        .animated-hr {
            width: 0;
            height: 2.1px;
            border: none;
            background-color: #D9D9D9;
            margin-top: 40px;
            margin-bottom: 40px;
        }

        .animated-hr.animate {
            animation: growLine 1s ease-out forwards;
        }

        @keyframes growLine {
            from {
                width: 0;
            }
            to {
                width: 12%;
            }
        }

        /* Bottom line animation */
        .bottom-hr {
            width: 97%;
            height: 1px;
            border: none;
            background-color: #666666;
            margin-top: 100px;
            transform-origin: left;
            transform: scaleX(0);
        }

        .bottom-hr.animate {
            animation: growBottomLine 1s ease-out forwards;
        }

        @keyframes growBottomLine {
            from {
                transform: scaleX(0);
            }
            to {
                transform: scaleX(1);
            }
        }
    </style>
</head>
<body>
    <div class="red-circle"></div>
    <div class="content-wrapper">
        <!-- Hamburger Menu -->
        <div class="hamburger">
            <div class="hamburger-line"></div>
            <div class="hamburger-line"></div>
            <div class="hamburger-line"></div>
        </div>

        <!-- Navigation Menu -->
        <nav class="navbar">
            <a href="index.html">Index</a>
            <a href="coding.html">Coding</a>
            <a href="design.html">Design</a>
            <a href="about.html">About</a>
        </nav>
        
        <div class="center">
            <h2 class="center-text" id="nameText"></h2>
            <a href="./about.html" class="know-more">→ Know More ←</a>
        </div>
        <hr class="animated-hr">
        <p></p>

        <!-- 16:9 Fullwidth Image Card -->
        <div class="fullwidth-image-card">
            <div class="fullwidth-image-card-inner">
                <img src="https://hdyloqcphgwfyuyvchvi.supabase.co/storage/v1/object/public/project-images//Red%20Minimalist%20Company%20Profile%20Presentation%20.png" alt="Fullwidth 16:9 Image">
            </div>
        </div>

        <!-- 4:5 Side-by-Side Image Cards -->
        <div class="sidebyside-image-cards">
            <div class="sidebyside-image-card left">
                <div class="sidebyside-image-card-inner">
                    <img src="https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=600&q=80" alt="Left 4:5 Image">
                </div>
                <a class="see-more-coding" href="coding.html">See more of Coding</a>
            </div>
            <div class="sidebyside-image-card right">
                <div class="sidebyside-image-card-inner">
                    <img src="https://images.unsplash.com/photo-1465101046530-73398c7f28ca?auto=format&fit=crop&w=600&q=80" alt="Right 4:5 Image">
                </div>
                <a class="see-more-design" href="design.html">See more of Design</a>
            </div>
        </div>
    </div>
    
    <!-- Name typing effect script -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const nameElement = document.getElementById('nameText');
            const fullName = "Jafar Tamboli.";
            let currentIndex = 0;
            
            function typeWriter() {
                if (currentIndex < fullName.length) {
                    nameElement.textContent += fullName.charAt(currentIndex);
                    currentIndex++;
                    setTimeout(typeWriter, 100);
                } else {
                    const cursor = document.createElement('span');
                    cursor.className = 'cursor';
                    cursor.textContent = '|';
                    nameElement.appendChild(cursor);
                }
            }
            
            nameElement.textContent = '';
            typeWriter();

            // Hamburger Menu Functionality
            const hamburger = document.querySelector('.hamburger');
            const navbar = document.querySelector('.navbar');
            
            if (hamburger && navbar) {
                hamburger.addEventListener('click', function(e) {
                    e.stopPropagation();
                    this.classList.toggle('active');
                    navbar.classList.toggle('active');
                });

                // Close menu when clicking a link
                const navLinks = document.querySelectorAll('.navbar a');
                navLinks.forEach(link => {
                    link.addEventListener('click', () => {
                        hamburger.classList.remove('active');
                        navbar.classList.remove('active');
                    });
                });

                // Close menu when clicking outside
                document.addEventListener('click', function(event) {
                    if (!hamburger.contains(event.target) && !navbar.contains(event.target)) {
                        hamburger.classList.remove('active');
                        navbar.classList.remove('active');
                    }
                });
            }

            // Animated HR Intersection Observer
            const hr = document.querySelector('.animated-hr');
            const bottomHrs = document.querySelectorAll('.bottom-hr');
            
            if (hr) {
                const observer = new IntersectionObserver(entries => {
                    entries.forEach(entry => {
                        if (entry.isIntersecting) {
                            hr.classList.add('animate');
                        }
                    });
                });

                observer.observe(hr);
            }

            if (bottomHrs.length > 0) {
                const bottomObserver = new IntersectionObserver(entries => {
                    entries.forEach(entry => {
                        if (entry.isIntersecting) {
                            entry.target.classList.add('animate');
                        }
                    });
                });

                bottomHrs.forEach(hr => {
                    bottomObserver.observe(hr);
                });
            }
        });
    </script>

    <hr class="bottom-hr">
    <div>
        <h1><span class="highlight">J</span>afar</h1>
    </div>
    <hr class="bottom-hr">
    

    <div>
        
    </div>
</body>
