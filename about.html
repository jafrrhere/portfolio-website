<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jafar Tamboli - About Me</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@900;400&family=Roboto:wght@300;400;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <style>
        @font-face {
            font-family: 'Akatab Bold';
            src: url('fonts/Akatab-Bold.ttf') format('truetype');
            font-weight: bold;
            font-style: normal;
        }

        /* Navigation Menu */
        .navbar {
            position: fixed;
            top: 0;
            right: 30px;
            width: auto;
            padding: 1rem;
            display: flex;
            justify-content: flex-end;
            gap: 2rem;
            z-index: 1000;
        }

        .navbar a {
            color: #fff;
            text-decoration: none;
            font-family: 'Akatab Bold', sans-serif;
            font-weight: 200;
            transition: color 0.2s ease;
            position: relative;
            background: transparent;
        }

        .navbar a::after {
            content: '';
            position: absolute;
            width: 0;
            height: 2px;
            bottom: -4px;
            left: 0;
            background-color: #666666;
            transition: width 0.3s ease;
        }

        .navbar a:hover::after {
            width: 100%;
        }

        .navbar a:hover {
            color: #666666;
            background: transparent;
        }

        /* Hamburger Menu */
        .hamburger {
            display: none;
            cursor: pointer;
            padding: 10px;
            position: fixed;
            top: 20px;
            right: 30px;
            z-index: 1001;
            pointer-events: auto;
        }

        .hamburger-line {
            width: 25px;
            height: 3px;
            background-color: #fff;
            margin: 5px 0;
            transition: all 0.3s ease;
        }

        @media (max-width: 768px) {
            .hamburger {
                display: block;
                pointer-events: auto;
            }

            .navbar {
                display: none;
                position: fixed;
                top: 0;
                right: 30px;
                width: auto;
                background: rgba(0, 0, 0, 0.95);
                padding: 60px 20px 20px 20px;
                border-radius: 0 0 10px 10px;
                pointer-events: auto;
            }

            .navbar.active {
                display: flex;
                flex-direction: column;
                align-items: flex-end;
                gap: 15px;
            }

            /* Hamburger Animation */
            .hamburger.active .hamburger-line:nth-child(1) {
                transform: rotate(45deg) translate(5px, 5px);
            }

            .hamburger.active .hamburger-line:nth-child(2) {
                opacity: 0;
            }

            .hamburger.active .hamburger-line:nth-child(3) {
                transform: rotate(-45deg) translate(7px, -6px);
            }
        }

        /* Animated Horizontal Line */
        .animated-hr {
            width: 0;
            height: 2.1px;
            border: none;
            background-color: #D9D9D9;
            margin-top: 40px;
            margin-bottom: 40px;
        }

        .animated-hr.animate {
            animation: growLine 0.3s ease-out forwards;
        }

        @keyframes growLine {
            from {
                width: 0;
            }
            to {
                width: 12%;
            }
        }

        /* Bottom line animation */
        .bottom-hr {
            width: 97%;
            height: 1px;
            border: none;
            background-color: #666666;
            margin-top: 100px;
            transform-origin: left;
            transform: scaleX(0);
        }

        .bottom-hr.animate {
            animation: growBottomLine 0.9s ease-out forwards;
        }

        @keyframes growBottomLine {
            from {
                transform: scaleX(0);
            }
            to {
                transform: scaleX(1);
            }
        }

        .terminal {
            color: #ffffff;
            font-family: 'Outfit', sans-serif;
            font-weight: 400;
            position: absolute;
            top: 100px;
            left: 100px;
            max-width: 800px;
        }
        .terminal-line {
            white-space: pre-wrap;
            line-height: 1.5;
        }
        .cursor {
            display: inline-block;
            width: 2px;
            height: 1.2em;
            background-color: #ffffff;
            animation: blink 1s infinite;
            vertical-align: middle;
        }
        @keyframes blink {
            50% { opacity: 0; }
        }
    </style>
</head>
<body>
    <div class="red-circle"></div>
    <div class="content-wrapper">
        <!-- Hamburger Menu -->
        <div class="hamburger">
            <div class="hamburger-line"></div>
            <div class="hamburger-line"></div>
            <div class="hamburger-line"></div>
        </div>

        <!-- Navigation Menu -->
        <nav class="navbar">
            <a href="index.html">Index</a>
            <a href="coding.html">Coding</a>
            <a href="design.html">Design</a>
            <a href="about.html">About</a>
        </nav>

        <hr class="animated-hr">

        <div class="terminal">
            <div id="terminal-content"></div>
        </div>
    </div>

    <script>
        // Hamburger Menu Functionality
        const hamburger = document.querySelector('.hamburger');
        const navbar = document.querySelector('.navbar');
        
        if (hamburger && navbar) {
            hamburger.addEventListener('click', function(e) {
                e.stopPropagation();
                this.classList.toggle('active');
                navbar.classList.toggle('active');
            });

            // Close menu when clicking a link
            const navLinks = document.querySelectorAll('.navbar a');
            navLinks.forEach(link => {
                link.addEventListener('click', () => {
                    hamburger.classList.remove('active');
                    navbar.classList.remove('active');
                });
            });

            // Close menu when clicking outside
            document.addEventListener('click', function(event) {
                if (!hamburger.contains(event.target) && !navbar.contains(event.target)) {
                    hamburger.classList.remove('active');
                    navbar.classList.remove('active');
                }
            });
        }

        // Animated HR Intersection Observer
        const hr = document.querySelector('.animated-hr');
        if (hr) {
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        hr.classList.add('animate');
                    }
                });
            }, { threshold: 0.1 });

            observer.observe(hr);
        }

        // Bottom HR Animation
        const bottomHr = document.querySelector('.bottom-hr');
        if (bottomHr) {
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        bottomHr.classList.add('animate');
                    }
                });
            }, { threshold: 0.1 });

            observer.observe(bottomHr);
        }

        // Terminal typing effect
        const terminalContent = document.getElementById('terminal-content');
        const text = [
            { text: '> whoami', delay: 50 },
            { text: 'Jafar Tamboli', delay: 50 },
            { text: '> cat about.ts', delay: 50 },
            { text: 'interface Developer {', delay: 50 },
            { text: '    name: string;', delay: 50 },
            { text: '    role: string;', delay: 50 },
            { text: '    skills: string[];', delay: 50 },
            { text: '}', delay: 50 },
            { text: 'const me: Developer = {', delay: 50 },
            { text: '    name: "Jafar Tamboli",', delay: 50 },
            { text: '    role: "Full Stack Developer",', delay: 50 },
            { text: '    skills: [', delay: 50 },
            { text: '        "TypeScript",', delay: 50 },
            { text: '        "React",', delay: 50 },
            { text: '        "Node.js",', delay: 50 },
            { text: '        "Python"', delay: 50 },
            { text: '    ]', delay: 50 },
            { text: '};', delay: 50 }
        ];

        let currentLine = 0;
        let currentChar = 0;
        let isDeleting = false;
        let typingDelay = 100;

        function typeText() {
            const currentText = text[currentLine].text;
            
            if (isDeleting) {
                terminalContent.textContent = currentText.substring(0, currentChar - 1);
                currentChar--;
                typingDelay = 50;
            } else {
                terminalContent.textContent = currentText.substring(0, currentChar + 1);
                currentChar++;
                typingDelay = 100;
            }

            if (!isDeleting && currentChar === currentText.length) {
                isDeleting = true;
                typingDelay = 2000;
            } else if (isDeleting && currentChar === 0) {
                isDeleting = false;
                currentLine = (currentLine + 1) % text.length;
                typingDelay = 500;
            }

            setTimeout(typeText, typingDelay);
        }

        typeText();
    </script>
</body>
</html>
