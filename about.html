<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jafar Tamboli - About Me</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@900;400&family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <style>
        .terminal {
            color: #ffffff;
            font-family: 'Outfit', sans-serif;
  font-weight: 400;
            position: absolute;
            top: 100px;
            left: 100px;
            max-width: 800px;
        }
        .terminal-line {
            white-space: pre-wrap;
            line-height: 1.5;
        }
        .cursor {
            display: inline-block;
            width: 2px;
            height: 1.2em;
            background-color: #ffffff;
            animation: blink 1s infinite;
            vertical-align: middle;
        }
        @keyframes blink {
            50% { opacity: 0; }
        }
    </style>
</head>
<body>
    <div class="red-circle"></div>
    <div class="content-wrapper">
        <!-- Navigation Menu -->
        <nav class="navbar">
            <a href="index.html">Index</a>
            <a href="coding.html">Coding</a>
            <a href="design.html">Design</a>
            <a href="about.html">About</a>
        </nav>
        <hr style="width: 97%; border: none; border-top: 1px solid #666666;">


        <div class="terminal">
            <div id="terminal-content"></div>
        </div>
    </div>


    <script>
        const terminalContent = document.getElementById('terminal-content');
        const text = [
            { text: '> whoami', delay: 50 },
            { text: 'Jafar Tamboli', delay: 50 },
            { text: '> cat about.ts', delay: 50 },
            { text: 'interface Developer {', delay: 50 },
            { text: '    name: string;', delay: 50 },
            { text: '    role: string;', delay: 50 },
            { text: '    skills: string[];', delay: 50 },
            { text: '}', delay: 50 },
            { text: 'const me: Developer = {', delay: 50 },
            { text: '    name: "Jafar Tamboli",', delay: 50 },
            { text: '    role: "Full Stack Developer",', delay: 50 },
            { text: '    skills: [', delay: 50 },
            { text: '        "TypeScript",', delay: 50 },
            { text: '        "React",', delay: 50 },
            { text: '        "Node.js",', delay: 50 },
            { text: '        "Python"', delay: 50 },
            { text: '    ]', delay: 50 },
            { text: '};', delay: 50 }
        ];

        function typeText(text, element, delay = 5) {
            let i = 0;
            return new Promise(resolve => {
                const interval = setInterval(() => {
                    if (i < text.length) {
                        element.textContent += text[i];
                        i++;
                    } else {
                        clearInterval(interval);
                        resolve();
                    }
                }, delay);
            });
        }

        async function startTyping() {
            for (const item of text) {
                const line = document.createElement('div');
                line.className = 'terminal-line';
                terminalContent.appendChild(line);
                
                await typeText(item.text, line);
                await new Promise(resolve => setTimeout(resolve, item.delay));
            }
            // Add cursor only at the end of the final line
            const cursor = document.createElement('span');
            cursor.className = 'cursor';
            terminalContent.appendChild(cursor);
        }

        startTyping();
    </script>
</body>
</html>
